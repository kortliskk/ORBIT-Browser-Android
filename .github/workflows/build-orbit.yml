name: ORBIT Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ORBIT-Browser-Android-1.0.0.zip'
      - '.github/workflows/build-orbit.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q ORBIT-Browser-Android-1.0.0.zip -d /tmp/orbit
          test -f /tmp/orbit/ORBIT-Browser-Android/app/build.gradle

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-35"
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: /tmp/orbit/ORBIT-Browser-Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-Android-APK
          path: /tmp/orbit/ORBIT-Browser-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
