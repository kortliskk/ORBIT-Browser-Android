name: ORBIT Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ORBIT-Browser-Android-1.0.0.zip'
      - '.github/workflows/build-orbit.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q ORBIT-Browser-Android-1.0.0.zip -d /tmp/orbit
          test -f /tmp/orbit/ORBIT-Browser-Android/app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: /tmp/orbit/ORBIT-Browser-Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-Android-APK
          path: /tmp/orbit/ORBIT-Browser-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
