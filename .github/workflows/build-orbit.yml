name: ORBIT Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ORBIT-Browser-Android-1.0.0.zip'
      - '.github/workflows/build-orbit.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q ORBIT-Browser-Android-1.0.0.zip -d /tmp/orbit
          test -f /tmp/orbit/ORBIT-Browser-Android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: /tmp/orbit/ORBIT-Browser-Android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ORBIT-Android-APK
          path: /tmp/orbit/ORBIT-Browser-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
